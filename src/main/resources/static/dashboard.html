<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — ShortURL</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>

<nav>
    <a href="index.html" class="nav-brand">⚡ ShortURL</a>
    <div class="nav-links">
        <span id="nav-user" style="color:var(--muted)"></span>
        <a href="index.html">Home</a>
        <a href="#" onclick="logout()"
           style="color:var(--danger)">Logout</a>
    </div>
</nav>

<div class="dashboard">

    <!-- Create URL Section -->
    <div class="card" style="margin-bottom:2rem">
        <h2 style="margin-bottom:1.2rem">Shorten a New URL</h2>
        <div id="dash-alert" class="alert alert-error"></div>
        <div id="dash-success" class="alert alert-success"></div>
        <div class="url-input-row">
            <input type="url" id="dash-url-input"
                   placeholder="https://example.com/very-long-url">
            <button class="btn btn-primary"
                    onclick="handleDashShorten()">
                Shorten ⚡
            </button>
        </div>
    </div>

    <!-- URLs Table -->
    <div class="card">
        <div class="dashboard-header">
            <h2>My URLs</h2>
            <span id="url-count" class="badge">0 links</span>
        </div>

        <div id="urls-container">
            <div class="empty-state">
                <h3>Loading your URLs...</h3>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
    requireAuth();

    const user = getUser();
    if (user) {
        document.getElementById('nav-user').textContent =
            `👋 ${user.name}`;
    }

    // Load URLs on page load
    loadUrls();

    async function loadUrls() {
        const urls = await getMyUrls();
        const container = document.getElementById('urls-container');
        const countBadge = document.getElementById('url-count');

        countBadge.textContent = `${urls.length} link${urls.length !== 1 ? 's' : ''}`;

        if (urls.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No URLs yet</h3>
                    <p>Shorten your first URL above</p>
                </div>`;
            return;
        }

        container.innerHTML = `
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Short URL</th>
                            <th>Original URL</th>
                            <th>Clicks</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="url-table-body">
                    </tbody>
                </table>
            </div>`;

        const tbody = document.getElementById('url-table-body');

        urls.forEach(url => {
            const row = document.createElement('tr');
            const date = new Date(url.createdAt)
                .toLocaleDateString('en-IN', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });

            row.innerHTML = `
                <td>
                    <a href="${url.shortUrl}" target="_blank"
                       class="short-link">
                        ${url.shortUrl.replace('http://localhost:8080/', '')}
                    </a>
                </td>
                <td>
                    <span class="original-url" title="${url.originalUrl}">
                        ${url.originalUrl}
                    </span>
                </td>
                <td><span class="badge">${url.clickCount} clicks</span></td>
                <td style="color:var(--muted)">${date}</td>
                <td style="display:flex; gap:0.5rem">
                    <button class="btn btn-copy"
                            onclick="copyToClipboard('${url.shortUrl}', this)">
                        Copy
                    </button>
                    <button class="btn btn-danger"
                            onclick="handleDelete(${url.id}, this)">
                        Delete
                    </button>
                </td>`;

            tbody.appendChild(row);
        });
    }

    async function handleDashShorten() {
        const input = document.getElementById('dash-url-input');
        const url = input.value.trim();

        if (!url) {
            showAlert('dash-alert', 'Please enter a URL');
            return;
        }

        try {
            const data = await shortenUrl(url);
            showAlert('dash-success',
                `✅ Shortened: ${data.shortUrl}`, 'success');
            input.value = '';
            loadUrls();     // refresh the table
        } catch (err) {
            showAlert('dash-alert', err.message);
        }
    }

    async function handleDelete(id, btn) {
        if (!confirm('Delete this URL?')) return;
        const success = await deleteUrl(id);
        if (success) {
            btn.closest('tr').remove();
            showAlert('dash-success', '✅ URL deleted', 'success');
            loadUrls();
        } else {
            showAlert('dash-alert', 'Failed to delete URL');
        }
    }
</script>
</body>
</html>
