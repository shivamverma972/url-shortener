<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortURL — Fast URL Shortener</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>

<nav>
    <a href="index.html" class="nav-brand">⚡ ShortURL</a>
    <div class="nav-links" id="nav-links">
        <a href="login.html">Login</a>
        <a href="login.html" class="btn-nav">Get Started</a>
    </div>
</nav>

<section class="hero">
    <h1>Shorten Any URL<br>In Seconds</h1>
    <p>Fast, secure, and reliable URL shortener.<br>
       Track clicks and manage all your links.</p>

    <div class="shortener-box card">
        <div id="hero-alert" class="alert alert-error"></div>

        <div class="url-input-row">
            <input type="url" id="url-input"
                   placeholder="Paste your long URL here...">
            <button class="btn btn-primary" onclick="handleShorten()">
                Shorten ⚡
            </button>
        </div>

        <div class="result-box" id="result-box">
            <a href="#" id="result-link" target="_blank"></a>
            <button class="btn btn-copy"
                    onclick="copyToClipboard(
                        document.getElementById('result-link').href,
                        this)">
                Copy
            </button>
        </div>

        <p style="color:var(--muted); font-size:0.85rem; margin-top:1rem">
            🔒 Login required to save and manage your URLs
        </p>
    </div>
</section>

<section class="stats">
    <div class="stat">
        <h3>56B+</h3>
        <p>Possible Short Codes</p>
    </div>
    <div class="stat">
        <h3>0.1ms</h3>
        <p>Average Redirect Time</p>
    </div>
    <div class="stat">
        <h3>24/7</h3>
        <p>Uptime Guarantee</p>
    </div>
</section>

<script src="app.js"></script>
<script>
    // Update nav if logged in
    const user = getUser();
    if (user) {
        document.getElementById('nav-links').innerHTML = `
            <span style="color:var(--muted)">
                Hi, ${user.name.split(' ')[0]}
            </span>
            <a href="dashboard.html" class="btn-nav">Dashboard</a>
            <a href="#" onclick="logout()"
               style="color:var(--danger)">Logout</a>
        `;
    }

    async function handleShorten() {
        const input = document.getElementById('url-input');
        const url = input.value.trim();

        if (!url) {
            showAlert('hero-alert', 'Please enter a URL');
            return;
        }

        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            showAlert('hero-alert',
                'URL must start with http:// or https://');
            return;
        }

        if (!getToken()) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const data = await shortenUrl(url);
            const resultBox = document.getElementById('result-box');
            const resultLink = document.getElementById('result-link');
            resultLink.href = data.shortUrl;
            resultLink.textContent = data.shortUrl;
            resultBox.style.display = 'flex';
            input.value = '';
        } catch (err) {
            showAlert('hero-alert', err.message);
        }
    }

    // Allow Enter key
    document.getElementById('url-input')
        .addEventListener('keypress', e => {
            if (e.key === 'Enter') handleShorten();
        });
</script>
</body>
</html>
