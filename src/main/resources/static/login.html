<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — URL Shortener</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>

<nav>
    <a href="index.html" class="nav-brand">⚡ ShortURL</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
    </div>
</nav>

<div class="auth-container">
    <div class="card">
        <div class="auth-tabs">
            <button class="auth-tab active"
                    onclick="switchTab('login')">Login</button>
            <button class="auth-tab"
                    onclick="switchTab('register')">Register</button>
        </div>

        <div id="auth-alert" class="alert alert-error"></div>

        <!-- Login Form -->
        <div id="login-form" class="auth-form active">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email"
                       placeholder="you@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password"
                       placeholder="••••••••">
            </div>
            <button class="btn btn-primary"
                    style="width:100%"
                    onclick="handleLogin()">
                Login
            </button>
            <p style="text-align:center; margin-top:1rem; color:var(--muted); font-size:0.9rem">
                No account?
                <a href="#" onclick="switchTab('register')"
                   style="color:var(--primary)">Register here</a>
            </p>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="auth-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name"
                       placeholder="Shivam Verma">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email"
                       placeholder="you@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password"
                       placeholder="Min 6 characters">
            </div>
            <button class="btn btn-primary"
                    style="width:100%"
                    onclick="handleRegister()">
                Create Account
            </button>
            <p style="text-align:center; margin-top:1rem; color:var(--muted); font-size:0.9rem">
                Have an account?
                <a href="#" onclick="switchTab('login')"
                   style="color:var(--primary)">Login here</a>
            </p>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
    // Redirect if already logged in
    if (getToken()) window.location.href = 'dashboard.html';

    function switchTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t =>
            t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f =>
            f.classList.remove('active'));

        if (tab === 'login') {
            document.querySelectorAll('.auth-tab')[0]
                .classList.add('active');
            document.getElementById('login-form')
                .classList.add('active');
        } else {
            document.querySelectorAll('.auth-tab')[1]
                .classList.add('active');
            document.getElementById('register-form')
                .classList.add('active');
        }
    }

    async function handleLogin() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        if (!email || !password) {
            showAlert('auth-alert', 'Please fill all fields');
            return;
        }
        await login(email, password);
    }

    async function handleRegister() {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        if (!name || !email || !password) {
            showAlert('auth-alert', 'Please fill all fields');
            return;
        }
        await register(name, email, password);
    }
</script>
</body>
</html>
